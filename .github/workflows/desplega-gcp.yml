# Desplega el CRM a la mateixa VM de Google Cloud que l'ERP (ERPNext).
#
# Compila la imatge aquí, la copia a la VM i hi arrenca el contenidor
# `vproof-crm`. S'hi entra pel Caddy de l'ERP (ports 80 i 443) amb el nom
# CRM_HOST: per defecte, crm.<ip-amb-guions>.sslip.io, que resol sol a la IP de
# la VM. Els contenidors de l'ERP no es toquen; al seu Caddyfile s'hi afegeix
# només el bloc del CRM, entre marques (deploy/gcp/proxy.sh). Les dades del CRM viuen al
# volum `vproof-crm-dades` de la VM i sobreviuen als desplegaments.
#
# L'accés a Google Cloud és el mateix que el de l'ERP: identitat federada per a
# qualsevol repositori de david-vproof, amb el compte github-deploy.
#
# La connexió amb l'ERP: els secrets VPROOFERP_API_KEY i VPROOFERP_API_SECRET
# (la clau d'API d'un usuari de l'ERP amb permís de lectura). Sense, el CRM
# arrenca igual, sense sincronització.
#
# La contrasenya inicial de l'administrador (admin@vproof.local): el secret
# CRM_ADMIN_PASSWORD del repositori si n'hi ha; si no, se'n genera una el primer
# cop i s'escriu al port sèrie de la VM (línia VPROOF_CRM_ADMIN).
name: Desplega el CRM a Google Cloud

on:
  workflow_dispatch:
    inputs:
      nomes_estat:
        description: "No despleguis: només ensenya l'estat del contenidor a la VM"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: desplegament-crm
  cancel-in-progress: false

jobs:
  desplega:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/541693513802/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deploy@vprooferp.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Accés per SSH a la VM
        run: |
          source deploy/gcp/config.sh
          gcloud compute ssh "$VM_NAME" --zone "$ZONE" --project "$PROJECT_ID" --quiet \
            --strict-host-key-checking=no --ssh-key-expire-after=2h \
            --command "echo connectat a \$(hostname); sudo docker ps --format '{{.Names}}  {{.Status}}  {{.Ports}}'"

      - name: Estat
        if: ${{ inputs.nomes_estat }}
        run: |
          source deploy/gcp/config.sh
          gcloud compute ssh "$VM_NAME" --zone "$ZONE" --project "$PROJECT_ID" --quiet --strict-host-key-checking=no \
            --ssh-key-expire-after=2h --command "sudo docker ps -a --filter name=vproof-crm; sudo docker logs --tail 60 vproof-crm 2>&1 || true"
          gcloud compute scp deploy/gcp/inspecciona.sh "$VM_NAME:/tmp/" --zone "$ZONE" --project "$PROJECT_ID" --quiet --strict-host-key-checking=no --ssh-key-expire-after=2h
          gcloud compute ssh "$VM_NAME" --zone "$ZONE" --project "$PROJECT_ID" --quiet --strict-host-key-checking=no \
            --ssh-key-expire-after=2h --command "bash /tmp/inspecciona.sh; rm -f /tmp/inspecciona.sh"

      - name: Compila la imatge
        if: ${{ !inputs.nomes_estat }}
        run: |
          docker build -t "vproof-crm:${GITHUB_SHA::12}" .
          docker save "vproof-crm:${GITHUB_SHA::12}" | gzip > vproof-crm.tar.gz
          ls -lh vproof-crm.tar.gz

      - name: Copia i arrenca a la VM
        if: ${{ !inputs.nomes_estat }}
        env:
          CRM_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
          VPROOFERP_API_KEY: ${{ secrets.VPROOFERP_API_KEY }}
          VPROOFERP_API_SECRET: ${{ secrets.VPROOFERP_API_SECRET }}
        run: |
          source deploy/gcp/config.sh
          # La clau SSH d'aquesta execució caduca sola: no se n'acumulen a les metadades del projecte.
          OPCIONS=(--zone "$ZONE" --project "$PROJECT_ID" --quiet --strict-host-key-checking=no --ssh-key-expire-after=2h)
          IP="$(gcloud compute instances describe "$VM_NAME" --zone "$ZONE" --project "$PROJECT_ID" --format='value(networkInterfaces[0].accessConfigs[0].natIP)')"
          CRM_HOST="${CRM_HOST:-crm.${IP//./-}.sslip.io}"
          echo "CRM_HOST=$CRM_HOST" >> "$GITHUB_ENV"
          gcloud compute scp vproof-crm.tar.gz deploy/gcp/remot.sh deploy/gcp/proxy.sh "$VM_NAME:/tmp/" "${OPCIONS[@]}"
          gcloud compute ssh "$VM_NAME" "${OPCIONS[@]}" \
            --command "ETIQUETA=${GITHUB_SHA::12} CRM_PORT=$CRM_PORT CRM_HOST=$CRM_HOST CRM_ADMIN_PASSWORD='${CRM_ADMIN_PASSWORD}' VPROOFERP_API_KEY='${VPROOFERP_API_KEY}' VPROOFERP_API_SECRET='${VPROOFERP_API_SECRET}' bash /tmp/remot.sh; codi=\$?; rm -f /tmp/remot.sh; exit \$codi"

      - name: Comprova des de fora
        if: ${{ !inputs.nomes_estat }}
        run: |
          # El certificat el demana Caddy la primera vegada: pot trigar un minut.
          CODI=000
          for _ in $(seq 1 20); do
            CODI="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$CRM_HOST/login" || true)"
            [ "$CODI" = 200 ] && break
            sleep 6
          done
          echo "https://$CRM_HOST → $CODI"
          echo "### vproof CRM: https://$CRM_HOST (resposta $CODI)" >> "$GITHUB_STEP_SUMMARY"
          [ "$CODI" = 200 ] || { echo "::error::Des de fora no respon."; exit 1; }
